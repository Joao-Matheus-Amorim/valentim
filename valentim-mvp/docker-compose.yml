version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: valentim-postgres
    environment:
      POSTGRES_USER: valentim
      POSTGRES_PASSWORD: valentim
      POSTGRES_DB: valentim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: valentim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  evolution:
    image: atendai/evolution-api:latest
    container_name: valentim-evolution
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: "http://localhost:8080"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-valentim-secret}"
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: "postgresql://valentim:valentim@postgres:5432/valentim"
      REDIS_ENABLED: "true"
      REDIS_URI: "redis://redis:6379"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
